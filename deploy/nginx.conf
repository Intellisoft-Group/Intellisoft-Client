gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types application/json application/javascript text/css text/plain image/svg+xml;

server_tokens off;
client_body_timeout 30s;
client_header_timeout 30s;
send_timeout 60s;

# Cloudflare Flexible terminates HTTPS at the edge and talks HTTP to this nginx.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  "~."     $http_x_forwarded_proto;
}

# Docker embedded DNS — re-resolve cms/web/api after container recreate (avoids stale-IP 502).
resolver 127.0.0.11 valid=10s ipv6=off;

# Light request-rate shield at the edge (per IP).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=20r/s;

server {
  listen 80;
  server_name api-client.theintellisoft.com;
  client_max_body_size 25m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location / {
    limit_req zone=api_limit burst=60 nodelay;
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
  }
}

server {
  listen 80;
  server_name cms-client.theintellisoft.com;
  client_max_body_size 25m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  location / {
    limit_req zone=web_limit burst=40 nodelay;
    set $cms_upstream cms:3001;
    proxy_pass http://$cms_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
    proxy_buffering on;
  }
}

server {
  listen 80;
  server_name client.theintellisoft.com;
  client_max_body_size 25m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location / {
    limit_req zone=web_limit burst=40 nodelay;
    set $web_upstream web:3002;
    proxy_pass http://$web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
    proxy_buffering on;
  }
}
