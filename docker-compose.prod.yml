x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intellisoft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-intellisoft}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=80
      - -c
      - log_min_duration_statement=2000
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intellisoft} -d ${POSTGRES_DB:-intellisoft}"]
      interval: 8s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
      DATABASE_URL: postgresql://${POSTGRES_USER:-intellisoft}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-intellisoft}?schema=public&connection_limit=10&pool_timeout=20
      API_PORT: 3000
      UPLOAD_DIR: uploads
    volumes:
      - uploads:/app/uploads
      # Place secrets/firebase-adminsdk.json on the VPS (Firebase → Project settings → Service accounts).
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-https://api-client.theintellisoft.com}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=768
      PORT: 3001
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-https://api-client.theintellisoft.com}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api-client.theintellisoft.com}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/robots.txt"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s
    mem_limit: 1024m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-https://api-client.theintellisoft.com}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
      PORT: 3002
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-https://api-client.theintellisoft.com}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api-client.theintellisoft.com}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/robots.txt"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      cms:
        condition: service_healthy
      web:
        condition: service_healthy
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  pgdata:
  uploads:
